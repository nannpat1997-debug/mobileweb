<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>LAB8 Gemini Vision - Photo Summary</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #f4f8fb;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        .container {
            max-width: auto;
            margin: 2em auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .header {
            border-bottom: 3px solid #3880ff;
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        .header h1 {
            color: #3880ff;
            margin: 0;
            font-size: 24px;
        }

        /* จัดเรียง 8 ช่อง */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 4 รูปต่อแถว */
            gap: 20px;
        }

        .photo-item {
            position: relative;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e1e8ed;
            transition: transform 0.2s;
        }

        .photo-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(56, 128, 255, 0.2);
        }

        .photo-item img {
            width: 100%;
            aspect-ratio: 1/1; /* บังคับเป็นสี่เหลี่ยมจัตุรัส */
            object-fit: cover; /* รูปไม่เบี้ยว */
            display: block;
        }

        .caption {
            padding: 10px;
            font-size: 13px;
            text-align: center;
            background: #f9f9f9;
            color: #666;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .photo-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>LAB8 Gemini Vision</h1>
        <p>By Nannaphat</p>
    </div>
    <h1 style="margin-top: 40px; color: #3880ff; text-align: center;">อัปโหลดจากแกลเลอรี่</h1>
    <div class="photo-grid">
        <div class="photo-item">
            <img src="../img/l8-1.png" alt="Result 1">
            <div class="caption">ภาพที่ 1</div>
        </div>
        <div class="photo-item">
            <img src="../img/l8-2.png" alt="Result 2">
            <div class="caption">ภาพที่ 2</div>
        </div>
        <div class="photo-item">
            <img src="../img/l8-3.png" alt="Result 3">
            <div class="caption">ภาพที่ 3</div>
        </div>
        <div class="photo-item">
            <img src="../img/l8-4.png" alt="Result 4">
            <div class="caption">ภาพที่ 4</div>
        </div>

        </div>
    
    <h1 style="margin-top: 40px; color: #3880ff; text-align: center; margin-bottom: 1em;" >ถ่ายด้วยกล้อง</h1>
    <div class="photo-grid">
        <div class="photo-item">
            <img src="../img/l8-5.png" alt="Result 5">
            <div class="caption">ภาพที่ 5</div>
        </div>
        <div class="photo-item">
            <img src="../img/l8-6.png" alt="Result 6">
            <div class="caption">ภาพที่ 6</div>
        </div>
        <div class="photo-item">
            <img src="../img/l8-7.png" alt="Result 7">
            <div class="caption">ภาพที่ 7</div>
        </div>
        <div class="photo-item">
            <img src="../img/l8-8.png" alt="Result 8">
            <div class="caption">ภาพที่ 8</div>
        </div>
    </div>
</div>

</body>
</html>
